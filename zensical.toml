# Zensical documentation site configuration.
# Build/preview locally with:  uv run --group docs zensical serve
# Build the static site with:  uv run --group docs zensical build   (-> ./site)

[project]
site_name = "esf — empirical stress factor degradation model"
site_description = "Documentation for esf, an empirical stress-factor Li-ion battery degradation model (fitting + simulation)."
site_author = "IFE"
site_url = "https://ife-bat.github.io/esf/"
repo_url = "https://github.com/ife-bat/esf"
repo_name = "ife-bat/esf"
copyright = "Copyright &copy; 2026 IFE"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "install.md" },
    { "Quickstart" = "quickstart.md" },
  ] },
  { "Workflows" = [
    { "Fitting parameters" = "workflows/fitting.md" },
    { "Predicting degradation" = "workflows/prediction.md" },
    { "Uncertainty" = "workflows/uncertainty.md" },
  ] },
  { "Reference" = [
    { "Units convention" = "reference/units.md" },
    { "Public API" = "reference/api.md" },
    { "Fitting architecture" = "fitting-architecture.md" },
    { "Background notes" = "background-notes.md" },
  ] },
]

extra_css = [
  "stylesheets/extra.css",
]

# MathJax (the architecture and background pages contain LaTeX)
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ife-bat/esf"

# Markdown extensions (kept in line with the Zensical default template)
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
