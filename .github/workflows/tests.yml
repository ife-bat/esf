name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the project (with dev dependencies)
        run: uv sync --dev
      - name: Lint with ruff
        run: uv run ruff check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported and current python on linux, plus the
          # development platform (windows)
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project (with dev dependencies)
        run: uv sync --dev

      - name: Run the test suite
        run: uv run pytest -q

      - name: Verify the wheel is self-contained
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv build --wheel
          uv run --isolated --no-project --with dist/*.whl python -c "
          import numpy as np
          from esf.models.cycle_counting_algorithm import CycleCounter
          soc = np.concatenate([np.linspace(0.9, 0.3, 30), np.linspace(0.3, 0.9, 30)])
          cc = CycleCounter(time_v=np.arange(len(soc)) * 60.0, soc_v=soc,
                            temp_v=np.full_like(soc, 25.0), crate_v=np.ones_like(soc), delta=0.01)
          cc.rainflow_process()
          assert list(cc.arr_n) == [0.5, 0.5], cc.arr_n
          print('installed wheel works')
          "
